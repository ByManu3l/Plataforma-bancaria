version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    # Spring Boot 4 y springdoc 3 exigen una migración: no se proponen solas.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      dependencias-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dependencias-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

spring:
  application:
    name: prueba-tecnica-bancaria
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banco_db}
    username: ${DB_USERNAME:banco_user}
    password: ${DB_PASSWORD:banco_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.bancaria.prueba: INFO

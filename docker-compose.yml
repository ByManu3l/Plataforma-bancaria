services:
  postgres:
    image: postgres:16-alpine
    container_name: banco-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-banco_db}
      POSTGRES_USER: ${DB_USERNAME:-banco_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banco_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-banco_user} -d ${DB_NAME:-banco_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: banco-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-banco_db}
      DB_USERNAME: ${DB_USERNAME:-banco_user}
      DB_PASSWORD: ${DB_PASSWORD:-banco_pass}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
